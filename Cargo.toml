[package]
name = "akrile"
version = "0.1.0"
edition = "2021"
description = "Custom archive format (.akrile) - WASM core"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
miniz_oxide = "0.7"
js-sys = "0.3"

[dev-dependencies]
# для `cargo test --lib` на нативном таргете

[profile.release]
# Было "z" (минимальный размер) — для deflate/CRC это заметно медленнее.
# 3 = максимальная скорость; размер .wasm вырастет на десятки КБ.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
