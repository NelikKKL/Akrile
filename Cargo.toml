[package]
name = "akrile"
version = "0.1.0"
edition = "2021"
description = "Custom archive format (.akrile) - WASM core"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
miniz_oxide = "0.7"
js-sys = "0.3"

[dev-dependencies]
# для `cargo test --lib` на нативном таргете

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
